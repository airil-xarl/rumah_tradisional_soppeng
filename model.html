<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model 3D Rumah Adat Soppeng</title>

    <!-- CDN model-viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <model-viewer 
        src="Aset/360/rumah_adat_soppeng.glb"
        alt="Model 3D Rumah Adat Soppeng"
        auto-rotate
        camera-controls
        ar
        exposure="1.2"
        shadow-intensity="1"
    >
    </model-viewer>
</body>
</html>
